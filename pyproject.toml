[tool.poetry]
name = "Proj1"
version = "0.1.0"
description = ""
authors = ["Alyona Sytnik <alyona-sytnik0908@yandex.ru>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
pytest = "^8.3.5"
pytest-cov = "^6.0.0"
requests = "^2.32.3"
python-dotenv = "^1.0.1"
openpyxl = "^3.1.5"
pandas = "^2.2.3"


[tool.poetry.group.dev.dependencies]
flake8 = "^7.0.0"
pytest = "^8.2.2"
pytest-cov = "^6.0.0"


[tool.poetry.group.lint.dependencies]
mypy = "^1.10.0"
black = "^24.4.2"
isort = "^5.13.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 109
target-version = ['py37']
[tool.isort]
profile = "black"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv|tests/'